name: DMP rx-opioid rerun (GSE151485)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opioid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (series-matrix path; no methylprep needed)
        run: pip install --quiet "numpy==2.4.4" "pandas==3.0.3" "scipy==1.17.1"
      - name: Run DMP (rx-opioid GSE151485)
        run: python scripts/revize/realdata/scripts/45_dmp_rx_opioid_gse151485.py
      - name: List outputs
        run: ls -la scripts/revize/realdata/out
      - uses: actions/upload-artifact@v4
        with:
          name: dmp-gse151485
          path: |
            scripts/revize/realdata/out/GSE151485_validation.json
            scripts/revize/realdata/out/GSE151485_dmp.csv
          if-no-files-found: error
      - name: Commit result back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/revize/realdata/out/GSE151485_validation.json
          git commit -m "DMP batch3: GSE151485 short-term Rx-opioid within-person paired (series-matrix betas): 32 pairs, 734,293 probes, 0 sig FDR<0.05 (honest null)" || echo "no changes"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break || sleep $((RANDOM % 10 + 5))
          done
