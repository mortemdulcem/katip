name: DMP substances batch 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gse252501
            script: scripts/revize/realdata/scripts/40_dmp_alcohol_brain_gse252501.py
            acc: ""
          - name: gse100264
            script: scripts/revize/realdata/scripts/41_dmp_idu_gse100264.py
            acc: ""
          - name: gse137364
            script: scripts/revize/realdata/scripts/43_dmp_cocaine_brain_bisulfite.py
            acc: GSE137364
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet numpy pandas scipy
      - name: Run DMP (${{ matrix.name }})
        env:
          ACCESSION: ${{ matrix.acc }}
        run: python ${{ matrix.script }}
      - name: List outputs
        run: ls -la scripts/revize/realdata/out
      - uses: actions/upload-artifact@v4
        with:
          name: dmp-${{ matrix.name }}
          path: |
            scripts/revize/realdata/out/*_validation.json
            scripts/revize/realdata/out/*_dmp.csv
          if-no-files-found: error

  aggregate:
    needs: dmp
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _art
      - name: Stage validation JSONs (commit small results only)
        run: |
          mkdir -p scripts/revize/realdata/out
          find _art -type f -name '*_validation.json' -exec cp {} scripts/revize/realdata/out/ \;
          ls -la scripts/revize/realdata/out
      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/revize/realdata/out/*_validation.json
          git commit -m "DMP batch2 results: GSE252501 alcohol-brain (NAc+DLPFC), GSE100264 IDU/HCV blood, GSE137364 cocaine-brain caudate (bisulfite)" || echo "no changes"
          git push || echo "push failed"
